<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_project-bustracking" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7047F5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow_project-bustracking" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid_project-bustracking" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad_project-bustracking)"/>
  <rect width="600" height="360" rx="16" fill="url(#grid_project-bustracking)"/>
  <circle cx="500" cy="80" r="140" fill="url(#glow_project-bustracking)"/>
  
  <!-- Subtle decorative tech shapes -->
  <circle cx="100" cy="280" r="80" fill="#ffffff" fill-opacity="0.05"/>
  <rect x="420" y="220" width="120" height="80" rx="12" fill="#ffffff" fill-opacity="0.1"/>
  
  <!-- Mockup Container Card -->
  <rect x="40" y="40" width="520" height="280" rx="16" fill="#181335" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  
  <!-- Browser / UI Dots -->
  <circle cx="70" cy="70" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="70" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="70" r="6" fill="#27c93f"/>
  
  <!-- Badge Pill -->
  <rect x="360" y="58" width="170" height="26" rx="13" fill="#ffffff" fill-opacity="0.18"/>
  <text x="445" y="75" font-family="'Poppins', system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">TRANSIT &amp; GEOLOCATION</text>
  
  <!-- Big Icon Emblem -->
  <circle cx="120" cy="180" r="48" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <text x="120" y="196" font-size="44" text-anchor="middle">🚌</text>
  
  <!-- Project Titles -->
  <text x="195" y="165" font-family="'Poppins', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Panimalar Bus Tracking</text>
  <text x="195" y="198" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="500" fill="#E0E7FF">Transit Logistics IoT</text>
  
  <!-- Key Metric / Stat Pill -->
  <rect x="195" y="220" width="220" height="32" rx="8" fill="#ffffff" fill-opacity="0.12"/>
  <text x="210" y="241" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#F5F3FF">✨ Live Route Tracking</text>
</svg>